<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tatto Studio — Setup</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#080e15;color:#d8e6ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(780px,100%);background:#101a25;border:1px solid #234354;border-radius:16px;padding:32px;box-shadow:0 16px 70px #0008}.brand{letter-spacing:3px;font-size:23px;font-weight:700;color:#42cfe7;text-shadow:0 0 16px #28b8d355}.brand span{color:#e563ac}h1{font-size:24px;margin:24px 0 10px}p,small{color:#a7b8c9;line-height:1.6}label{display:block;margin:24px 0 9px;font-weight:600}.row{display:flex;gap:10px}input{min-width:0;flex:1;background:#080f18;border:1px solid #375165;border-radius:7px;padding:12px;color:inherit;font:inherit}input:focus{outline:2px solid #38a9bc}button{background:#193644;color:#dcecf2;border:1px solid #386678;border-radius:7px;padding:11px 18px;cursor:pointer;font:inherit}button:hover{background:#23566a;box-shadow:0 0 14px #26d1ec33}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.primary{background:#872b61;border-color:#c34f90}.primary:hover{background:#a13976;box-shadow:0 0 16px #ea549a44}#status{min-height:25px;white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 0 0}#status.error{color:#ffa2a2}#data{overflow-wrap:anywhere;font-size:12px;margin-top:24px}@media(max-width:540px){.panel{padding:20px}.row{flex-wrap:wrap}.row input{flex-basis:100%}}
</style></head><body><main class="panel">
<div class="brand"><span>TATTO</span> STUDIO</div><h1 data-i="heading">Set up your paths</h1>
<p data-i="intro">Detected paths are filled in automatically. Check them, then open the editor.</p>
<form id="form">
<label for="game_directory" data-i="game">Game folder</label><div class="row"><input id="game_directory" required autocomplete="off" spellcheck="false"><button type="button" data-field="game_directory" data-i="browse">Browse</button></div><small data-i="gameHelp">Browse to bin/x64/Cyberpunk2077.exe, or paste the game folder path.</small>
<label for="vortex_staging_directory" data-i="staging">Vortex staging folder</label><div class="row"><input id="vortex_staging_directory" required autocomplete="off" spellcheck="false"><button type="button" data-field="vortex_staging_directory" data-i="browse">Browse</button></div><small data-i="stagingHelp">Find this in Vortex → Settings → Mods. For manual installation, choose a folder for generated mod files.</small>
<label for="wolvenkit_cli">WolvenKit.CLI.exe</label><div class="row"><input id="wolvenkit_cli" required autocomplete="off" spellcheck="false"><button type="button" data-field="wolvenkit_cli" data-i="browse">Browse</button></div>
<div class="actions"><button type="submit" class="primary" data-i="save">Save and open editor</button><button type="button" id="detect" data-i="detect">Detect again</button><button type="button" id="back" data-i="back" hidden>Back to editor</button></div>
</form><p id="status" role="status" aria-live="polite"></p><p id="data"></p>
</main><script type="module" src="setup.mjs"></script></body></html>
