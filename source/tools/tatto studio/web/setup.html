<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tatto Studio</title><style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#080e15;color:#d8e6ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(780px,100%);background:#101a25;border:1px solid #234354;border-radius:16px;padding:32px;box-shadow:0 16px 70px #0008}.brand{letter-spacing:3px;font-size:23px;font-weight:700;color:#42cfe7;text-shadow:0 0 16px #28b8d355}.brand span{color:#e563ac}h1{font-size:24px;margin:24px 0 10px}p,small{color:#a7b8c9;line-height:1.6}label{display:block;margin:24px 0 9px;font-weight:600}.row{display:flex;gap:10px}input{min-width:0;flex:1;background:#080f18;border:1px solid #375165;border-radius:7px;padding:12px;color:inherit;font:inherit}input:focus{outline:2px solid #38a9bc}button{background:#193644;color:#dcecf2;border:1px solid #386678;border-radius:7px;padding:11px 18px;cursor:pointer;font:inherit}button:hover{background:#23566a;box-shadow:0 0 14px #26d1ec33}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.primary{background:#872b61;border-color:#c34f90}.primary:hover{background:#a13976;box-shadow:0 0 16px #ea549a44}#status{min-height:25px;white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 0 0}#status.error{color:#ffa2a2}#data{overflow-wrap:anywhere;font-size:12px;margin-top:24px}@media(max-width:540px){.panel{padding:20px}.row{flex-wrap:wrap}.row input{flex-basis:100%}}
select{max-width:100%;background:#080f18;color:inherit;border:1px solid #375165;padding:10px;font:inherit}.row select{flex:1;min-width:0}input[type=checkbox]{flex:0}[hidden]{display:none!important}</style></head><body><main class="panel"><div class="brand">TATTO STUDIO</div><label for="languageSelect">语言</label><select id="languageSelect"></select><h1>确认运行路径</h1><p>已自动填写识别到的位置，可修改后保存。</p><form id="form"><label for="installation_mode">安装方式</label><select id="installation_mode"><option value="vortex">Vortex</option><option value="manual">手动安装</option></select><section id="section_game_directory"><label for="game_directory">游戏目录</label><div class="row"><input class="path-value" id="game_directory" autocomplete="off" spellcheck="false"><button type="button" data-field="game_directory">选择…</button></div></section><section id="section_wolvenkit_cli"><label for="wolvenkit_cli">WolvenKit.CLI.exe</label><div class="row"><input class="path-value" id="wolvenkit_cli" autocomplete="off" spellcheck="false"><button type="button" data-field="wolvenkit_cli">选择…</button></div></section><section id="section_data_directory"><label for="data_directory">个人数据目录</label><div class="row"><input class="path-value" id="data_directory" autocomplete="off" spellcheck="false"><button type="button" data-field="data_directory">选择…</button></div></section><section id="section_vortex_staging_directory"><label for="vortex_staging_directory">Vortex 暂存目录</label><div class="row"><input class="path-value" id="vortex_staging_directory" autocomplete="off" spellcheck="false"><button type="button" data-field="vortex_staging_directory">选择…</button></div></section><p>迁移将复制全部个人数据，原目录保留备份。</p><label><input type="checkbox" id="use_existing">使用目标目录已有数据</label><section id="section_target"><label for="library_publish_target">游戏纹身库发布位置</label><div class="row"><select id="library_publish_target"></select><button type="button" data-field="library_publish_target">选择…</button></div><p>更新游戏纹身库后，在 Vortex 部署即可，无需另装 ZIP。</p></section><div class="actions"><button type="submit" class="primary">保存并打开编辑器</button><button type="button" id="detect">重新检测</button><button type="button" id="back">返回编辑器</button></div></form><p id="status" role="status" aria-live="polite"></p><p id="data" class="path-value"></p><div id="diagnostics"></div></main><script type="module" src="/setup.mjs"></script></body></html>
